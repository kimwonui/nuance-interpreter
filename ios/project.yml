# xcodegen generate  →  Interpreter.xcodeproj 생성 (생성물은 깃에 올리지 않음)
name: Interpreter
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Interpreter/Config/App.xcconfig
  Release: Interpreter/Config/App.xcconfig
targets:
  Interpreter:
    type: application
    platform: iOS
    sources:
      - path: Interpreter
        excludes:
          - "Config/**"
    info:
      path: Interpreter/Info.plist
      properties:
        CFBundleDisplayName: 통역
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSMicrophoneUsageDescription: 말한 내용을 상대 언어로 통역하려면 마이크가 필요해요. 음성은 저장하지 않아요.
        NSLocalNetworkUsageDescription: 개발 중에는 같은 와이파이의 통역 서버에 연결해요.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIAppFonts:
          - NotoSansKR_400Regular.ttf
          - NotoSansKR_500Medium.ttf
          - NotoSansKR_700Bold.ttf
        InterpreterServerURL: $(INTERPRETER_SERVER_URL)
        InterpreterAppKey: $(INTERPRETER_APP_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        GENERATE_INFOPLIST_FILE: NO
